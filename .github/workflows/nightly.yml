name: Nightly playlist

on:
  schedule:
    # 02:00 UTC (03:00/04:00 Europe/Rome); GitHub può ritardare l'avvio, ma la build non dipende dall'ora
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Esecuzione manuale'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nightly-playlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: ffprobe diagnostics
        run: |
          which ffprobe
          ffprobe -version

      - name: Restore probe cache
        uses: actions/cache@v4
        with:
          path: output/probe_cache.json
          key: probe-cache-v2-${{ github.run_id }}
          restore-keys: probe-cache-v2-

      - name: Build playlist
        run: python src/main.py

      - name: Probe summary
        if: ${{ !cancelled() }}
        run: python src/probe_summary.py

      - name: Upload playlist
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: |
            output/final_playlist.m3u
            output/final_playlist_full.m3u
            output/lcn_changes.json
            output/lcn_unmatched_report.json
            output/probe_stats.json
            output/probe_results.json

      - name: Commit official LCN table and playlist
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git add -f output/final_playlist.m3u output/final_playlist_full.m3u
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            if git diff --cached --quiet -- state/lcn_official.json; then msg="Update playlist (LCN invariata)"; else msg="Update playlist e LCN ufficiale"; fi
            git commit -m "$msg"
            git push
          fi
