name: Nightly playlist

on:
  schedule:
    # 00:17 UTC (02:17 CEST / 01:17 CET Europe/Rome): la build ora dura 2-3 ore (probing + Quality Selection)
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Esecuzione manuale'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nightly-playlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: ffprobe diagnostics
        run: |
          which ffprobe
          ffprobe -version

      - name: Restore probe and quality cache
        uses: actions/cache@v4
        with:
          path: |
            output/probe_cache.json
            output/quality_cache.json
          key: probe-cache-v3-${{ github.run_id }}
          restore-keys: probe-cache-v3-

      - name: Build playlist
        env:
          QUALITY_WORKERS: '4'
          QUALITY_SECONDS: '20'
          QUALITY_BUDGET_S: '5400'
        run: python src/main.py

      - name: Probe summary
        if: ${{ !cancelled() }}
        run: python src/probe_summary.py

      - name: Upload playlist
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: |
            output/final_playlist.m3u
            output/final_playlist_full.m3u
            output/lcn_changes.json
            output/lcn_unmatched_report.json
            output/probe_stats.json
            output/probe_results.json
            output/quality_report.json
            output/quality_cache.json
            output/epg_report.json

      - name: Commit official LCN table and playlist
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git add -f output/final_playlist.m3u output/final_playlist_full.m3u
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            if git diff --cached --quiet -- state/lcn_official.json; then msg="Update playlist (LCN invariata)"; else msg="Update playlist e LCN ufficiale"; fi
            git commit -m "$msg"
            git push
          fi
